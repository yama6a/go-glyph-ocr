name: ci

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled so the label jobs run again on a label change, not only on a push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  # Only push runs of a PR share a group, so a label event never cancels another run.
  group: ci-${{ github.ref }}-${{ github.event.action == 'synchronize' && 'sync' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-label:
    name: release label
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: yama6a/gha/.github/actions/release-label@v2

  version-check:
    name: version check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the newest release tag sets the expected major
      - run: .build/version-check_test.sh
      - run: .build/version-check.sh
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}

  go:
    uses: yama6a/gha/.github/workflows/go-ci.yaml@v2

  # go-ci tests on arm64 only. The parity tests compare floats exactly, and the compiler
  # fuses x*y+z on arm64 and, with GOAMD64=v3, on amd64. GOAMD64=v1 never fuses.
  amd64:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # one shared key would hand arm64 or fuzz builds to the other jobs
      - name: Test with GOAMD64=v1
        env:
          GOAMD64: v1
        run: go test ./... -count=1
      - name: Test with GOAMD64=v3
        env:
          GOAMD64: v3
        run: go test ./... -count=1

  fuzz:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # one shared key would hand amd64 or fuzz builds to the other jobs
      - run: make fuzz FUZZTIME=10s
      # go test -fuzz writes each failing input to <package>/testdata/fuzz/<FuzzName>/.
      - name: Collect the new fuzz inputs
        if: failure()
        env:
          DEST: ${{ runner.temp }}/fuzz-findings
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          git ls-files -z --others --exclude-standard \
            | { grep -z -E '(^|/)testdata/fuzz/' || true; } \
            | xargs -0 -r cp --parents -t "$DEST"
          find "$DEST" -type f
      - name: Upload the new fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: ${{ runner.temp }}/fuzz-findings

  yaml:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/yaml-checks@v2
